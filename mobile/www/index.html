<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f1" />
    <title>Branch Commerce</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #f6f7f1;
        color: #182018;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        background:
          radial-gradient(circle at 15% 10%, rgb(130 175 65 / 22%), transparent 36%),
          linear-gradient(145deg, #fbfcf7, #e9ecdf);
      }

      main {
        width: min(100%, 420px);
      }

      .mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 15px;
        background: #24351e;
        color: #d8ff73;
        font:
          700 23px/1 Arial,
          sans-serif;
        box-shadow: 0 14px 35px rgb(36 53 30 / 22%);
      }

      h1 {
        margin: 26px 0 8px;
        font-size: clamp(34px, 10vw, 50px);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0 0 28px;
        color: #5b6557;
        font:
          500 16px/1.5 Arial,
          sans-serif;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 15px 20px;
        background: #24351e;
        color: #f7ffe7;
        font:
          700 15px/1 Arial,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">BC</div>
      <h1>Branch Commerce</h1>
      <p>Não foi possível carregar o sistema. Verifique sua conexão e tente novamente.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
